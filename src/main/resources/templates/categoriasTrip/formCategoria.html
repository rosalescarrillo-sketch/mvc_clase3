<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Nueva Categoría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Crear Categoría</h3>

        <form th:action="@{/categorias/save}" th:object="${categoria}" method="post">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Aventura" required>
          </div>

          <button class="btn btn-primary">Guardar</button>
          <a class="btn btn-secondary" th:href="@{/}">Volver</a>
        </form>

      </div>
    </div>
  </div>
</body>
</html>
