<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Trip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">

      <h3 class="mb-3">Crear Nuevo Trip</h3>

      <form th:action="@{/trips/save}" method="post">

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Destino</label>
            <input class="form-control" name="destination" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Costo</label>
            <input class="form-control" type="number" step="0.01" name="price" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Duración (días)</label>
            <input class="form-control" type="number" name="duration" required>
          </div>

          <div class="col-md-4">
            <label class="form-label">Tipo</label>
            <select class="form-select" name="tipo" required>
              <option value="LOCAL">LOCAL</option>
              <option value="INTERNACIONAL">INTERNACIONAL</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select class="form-select" name="categoriaId" required>
              <option value="" disabled selected>Seleccione...</option>
              <option th:each="c : ${categorias}"
                      th:value="${c.id}"
                      th:text="${c.nombre}">
              </option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Fecha publicación</label>
            <input class="form-control" name="fechaPublicacion" placeholder="Mon Jan 10 00:05:00 CST 2022" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Foto URL</label>
            <input class="form-control" name="fotoUrl" placeholder="/img/archivo.jpg" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Calificación</label>
            <input class="form-control" type="number" name="calificacion" min="1" max="10" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Destacado</label>
            <select class="form-select" name="destacado" required>
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="3" required></textarea>
          </div>

        </div>

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary">Guardar</button>
          <a class="btn btn-secondary" th:href="@{/}">Volver</a>
          <a class="btn btn-outline-primary" th:href="@{/categorias/new}">Crear Categoría</a>
        </div>

      </form>

    </div>
  </div>
</div>

</body>
</html>
