<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Detalle Trip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-3">Detalle del Trip</h2>

      <!-- Si NO existe trip, mostramos mensaje -->
      <div th:if="${trip == null}">
        <div class="alert alert-danger" th:text="${mensaje != null ? mensaje : 'No llegó el objeto trip al HTML.'}"></div>
      </div>

      <!-- Si SÍ existe trip -->
      <div th:if="${trip != null}">
        <div class="row g-4">
          <div class="col-md-4">
            <img th:src="${trip.fotoUrl}" class="img-fluid rounded" style="width:100%;height:220px;object-fit:cover;">
          </div>

          <div class="col-md-8">
            <h4 th:text="${trip.destination}"></h4>
            <p class="text-muted mb-1">
              Tipo: <strong th:text="${trip.tipo}"></strong>
            </p>
            <p class="text-muted mb-1">
              Fecha publicación: <strong th:text="${trip.fechaPublicacion}"></strong>
            </p>
            <p class="mb-1">
              Costo: <strong th:text="${trip.price}"></strong>
            </p>
            <p class="mb-1">
              Duración (días): <strong th:text="${trip.duration}"></strong>
            </p>

            <p class="mt-3" th:text="${trip.descripcion}"></p>

            <div class="mt-2">
              <span class="badge"
                    th:classappend="${trip.destacado} ? ' text-bg-success' : ' text-bg-secondary'"
                    th:text="${trip.destacado} ? 'Destacado' : 'No destacado'"></span>

              <span class="ms-2 fw-bold"
                    th:classappend="${trip.calificacion < 6} ? ' text-danger' : ' text-success'">
                Calificación: <span th:text="${trip.calificacion}"></span>
              </span>
            </div>
          </div>
        </div>
      </div>

      <hr class="my-4">
      <a class="btn btn-secondary" href="/">Volver</a>
    </div>
  </div>

</div>

</body>
</html>
